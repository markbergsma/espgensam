# Shared espgensam configuration — BOARD-INDEPENDENT.
#
# Everything here holds regardless of which controller the firmware runs on. Nothing in this file
# may name a GPIO: pins belong to packages/board_*.yaml. See AGENTS.md, "The board seam contract".
#
# Tunables are driven by substitutions so a device config can override them without restating the
# block.

substitutions:
  discovery_slots: "16"
  control_window: "60s"

external_components:
  - source:
      type: local
      path: components
    components: [gensam]

web_server:
  sorting_groups:
    - id: system_controls
      name: "System Controls"
      sorting_weight: -10
    - id: group_controls
      name: "Group Preset"
      sorting_weight: -5

gensam:
  id: gensam_hub
  sam_upload: {}
  group_select:
    name: "Group Preset"
    web_server:
      sorting_group_id: group_controls
      sorting_weight: 30
  rx_buffer_size: 512
  listen_only: ${listen_only}
  glm_inactivity_cooldown: 15s
  poll_interval: 1s
  control_window: ${control_window}
  telemetry_averaging_period: 60s
  min_volume_db: ${min_volume_db}
  max_volume_db: ${max_volume_db}
  startup_volume_db: ${startup_volume_db}
  discovery_slots: ${discovery_slots}

  rediscover_button:
    name: "Rediscover Monitors"
    web_server:
      sorting_group_id: system_controls
      sorting_weight: 50

  volume_db:
    name: "Volume (dB)"
    web_server:
      sorting_group_id: system_controls
      sorting_weight: 10

  system_mute:
    name: "Mute"
    web_server:
      sorting_group_id: system_controls
      sorting_weight: 20

  system_power:
    name: "System Power"
    web_server:
      sorting_group_id: system_controls
      sorting_weight: 25

  system_leds:
    name: "Monitor LEDs"
    web_server:
      sorting_group_id: system_controls
      sorting_weight: 30

  calibration_bypass:
    name: "Bypass Calibration"
    web_server:
      sorting_group_id: system_controls
      sorting_weight: 40

  phase_correction_bypass:
    name: "Bypass Phase Correction"
    disabled_by_default: true
    web_server:
      sorting_group_id: system_controls
      sorting_weight: 42

  iss_sleep_delay:
    name: "ISS Sleep Delay"
    web_server:
      sorting_group_id: system_controls
      sorting_weight: 44

  iss_sensitivity:
    name: "ISS Sensitivity"
    web_server:
      sorting_group_id: system_controls
      sorting_weight: 46
