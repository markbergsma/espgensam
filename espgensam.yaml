substitutions:
  name: "espgensam"
  friendly_name: "Genelec SAM Controller"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [gensam]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

# Genelec SAM RS485 Hub Component (M5Stack AtomS3 Lite + Atomic RS485 Base)
gensam:
  id: gensam_hub
  tx_pin: GPIO6
  rx_pin: GPIO5
  rx_buffer_size: 512
  listen_only: false
  glm_inactivity_cooldown: 30s
