# espgensam — device identity, network and tunables.
#
# Hardware lives in packages/board_*.yaml, everything board-independent in packages/gensam.yaml.
# To target a different controller, change the one `board:` line below; nothing else moves.
# See README.md for the supported boards and their wiring.

substitutions:
  name: "espgensam"
  friendly_name: "Genelec SAM Controller"

  listen_only: "false"
  min_volume_db: "-80.0"
  max_volume_db: "-30.0"
  startup_volume_db: "-50.0"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  devices:
    - id: dev_subwoofer
      name: "Subwoofer"
    - id: dev_left_monitor
      name: "Left Monitor"
    - id: dev_right_monitor
      name: "Right Monitor"

packages:
  # --- Board selection: exactly one of these ---
  board: !include packages/board_m5stack_atoms3_rs485_base.yaml
  # board: !include packages/board_waveshare_esp32s3_rs485_can.yaml
  # board: !include packages/board_m5stack_atoms3_rs485_iso.yaml

  gensam: !include packages/gensam.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

captive_portal:

# DEBUG is required for the 15 s `Stats:` line that transceiver comparisons are read from.
logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
