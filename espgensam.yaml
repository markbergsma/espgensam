# espgensam — device identity and network.
# The board, device name and tunables come from the ignored espgensam-local.yaml: copy
# espgensam-local.yaml.example to it and edit the values.
# Copy secrets.yaml.example to secrets.yaml for Wi-Fi credentials and the ESPHome API key.

substitutions: !include espgensam-local.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

packages:
  board: !include packages/board_${board}.yaml
  gensam: !include packages/gensam.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  local: true

logger:
  level: "${log_level}"

api:
  reboot_timeout: 0s # Standalone operation without automatic reboot
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
