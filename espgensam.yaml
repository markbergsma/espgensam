substitutions:
  name: "espgensam"
  friendly_name: "Genelec SAM Controller"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  devices:
    - id: dev_subwoofer
      name: "Subwoofer"
    - id: dev_left_monitor
      name: "Left Monitor"
    - id: dev_right_monitor
      name: "Right Monitor"

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [gensam]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

captive_portal:

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

# Genelec SAM RS485 Hub Component (M5Stack AtomS3 Lite + Atomic RS485 Base)
gensam:
  id: gensam_hub
  tx_pin: GPIO6
  rx_pin: GPIO5
  rx_buffer_size: 512
  listen_only: false
  glm_inactivity_cooldown: 30s
  poll_interval: 1s
  telemetry_averaging_period: 60s
  min_volume_db: -80.0
  max_volume_db: -30.0
  startup_volume_db: -50.0

  glm_adapter_active:
    name: "GLM USB Adapter Active"

  rediscover_button:
    name: "Rediscover Monitors"

  volume_db:
    name: "Volume (dB)"

  audio_source:
    name: "Audio Source"

  monitors:
    - serial_number: "7350APM88123456"
      unique_id: 1842915
      name: "Subwoofer"
      device_id: dev_subwoofer
    - serial_number: "8330AP99234567"
      unique_id: 1654321
      name: "Left Monitor"
      device_id: dev_left_monitor
    - serial_number: "8330AP77345678"
      unique_id: 1987654
      name: "Right Monitor"
      device_id: dev_right_monitor

media_player:
  - platform: gensam
    name: "Genelec SAM System"

# Physical button on M5Stack AtomS3 Lite (GPIO41, active-low) triggers monitor rediscovery
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Rediscover Button"
    on_press:
      then:
        - lambda: id(gensam_hub).rediscover_monitors();
